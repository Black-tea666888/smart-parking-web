name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://smart-parking-8df51.web.app/user/
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_PARKING_8DF51 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Firebase service account secret
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT_SMART_PARKING_8DF51 is not set yet, so nothing was deployed."
      - name: Deploy to the live site
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_PARKING_8DF51 }}
          channelId: live
          projectId: smart-parking-8df51
